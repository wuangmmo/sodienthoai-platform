name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify Go dependency lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Upload generated Go dependency files
        uses: actions/upload-artifact@v4
        with:
          name: api-go-deps
          path: |
            apps/api/go.mod
            apps/api/go.sum
      - run: go test ./...
      - run: go vet ./...

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sodienthoai
          POSTGRES_USER: sodienthoai
          POSTGRES_PASSWORD: sodienthoai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sodienthoai -d sodienthoai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sodienthoai:sodienthoai@localhost:5432/sodienthoai?sslmode=disable
      MIGRATIONS_DIR: ../../database/migrations
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify Go dependency lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Verify core schema
        run: |
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "SELECT e164, seo_status, verification_status FROM phone_numbers LIMIT 0;"
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "SELECT phone_number_id, source_type, confidence FROM phone_sources LIMIT 0;"
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "SELECT version FROM schema_migrations ORDER BY version;"
      - name: Seed lookup fixture
        working-directory: .
        run: PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -f database/testdata/seed.sql
      - name: Verify seeded phone
        run: |
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT e164 || '|' || verification_status || '|' || seo_status FROM phone_numbers WHERE e164='+84705899899';" | grep -Fx "+84705899899|verified|indexable"
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT count(*) FROM phone_sources s JOIN phone_numbers p ON p.id=s.phone_number_id WHERE p.e164='+84705899899' AND s.source_type='ci_seed';" | grep -Fx "1"
      - name: Start API against PostgreSQL
        env:
          API_PORT: "18080"
          REDIS_ADDR: localhost:6379
          OPENSEARCH_URL: http://localhost:9200
        run: echo "HTTP smoke test runs in the integration job where Redis and OpenSearch are available."

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build

  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web dependency lock
        run: |
          cd apps/web
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Build API image
        run: docker build -t sodienthoai-api:ci apps/api
      - name: Build Web image
        run: docker build -t sodienthoai-web:ci apps/web
      - name: Build Control Center image
        run: docker build -t sodienthoai-control:ci apps/control
      - name: Validate Compose configuration
        run: docker compose config --quiet


  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sodienthoai
          POSTGRES_USER: sodienthoai
          POSTGRES_PASSWORD: sodienthoai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sodienthoai -d sodienthoai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
    env:
      DATABASE_URL: postgres://sodienthoai:sodienthoai@localhost:5432/sodienthoai?sslmode=disable
      REDIS_ADDR: localhost:6379
      OPENSEARCH_URL: http://localhost:9200
      API_PORT: "18080"
      MIGRATIONS_DIR: ../../database/migrations
      ADMIN_API_TOKEN: v42-ci-admin-token-not-production
      ADMIN_SESSION_SECRET: v44-ci-admin-session-secret-not-production-123456789
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify Go dependency lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9200/_cluster/health >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Seed lookup fixture
        working-directory: .
        run: PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -f database/testdata/seed.sql
      - name: Start API
        run: |
          nohup go run ./cmd/api > /tmp/sodienthoai-api.log 2>&1 &
          echo $! > /tmp/sodienthoai-api.pid
      - name: Bootstrap V44 admin fixture
        env:
          ADMIN_EMAIL: admin-ci@sodienthoai.test
          ADMIN_PASSWORD: v44-ci-password-not-production
          ADMIN_NAME: CI Administrator
          ADMIN_ROLE: super-admin
        run: go run ./cmd/admin-user
      - name: Verify readiness
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS http://localhost:18080/readyz || true)
            echo "$BODY"
            echo "$BODY" | grep -q '"status":"ready"' && exit 0
            sleep 1
          done
          cat /tmp/sodienthoai-api.log
          exit 1
      - name: Verify V44 admin authentication
        run: |
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"admin-ci@sodienthoai.test","password":"v44-ci-password-not-production"}' http://localhost:18080/admin/auth/login)
          echo "$LOGIN" | grep -q '"role":"super-admin"'
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/admin/auth/me | grep -q 'admin-ci@sodienthoai.test'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/v1/admin/dashboard | grep -q '"phones"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/v1/control/me | grep -q '"dashboard.view"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/v1/control/sites | grep -q '"sodienthoai.com"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/v1/control/sites | grep -q '"mapsviet.com"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:18080/v1/control/dashboard | grep -q '"sites":4'
          ORG=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT id FROM organizations WHERE slug='sodienthoai-ecosystem';")
          SUPERROLE=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT id FROM control_roles WHERE organization_id='$ORG' AND slug='super-admin';")
          ADMINID=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT id FROM admin_users WHERE email='admin-ci@sodienthoai.test';")
          ASSIGN=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT id FROM control_admin_assignments WHERE admin_user_id='$ADMINID' AND role_id='$SUPERROLE' AND organization_id='$ORG' AND site_id IS NULL LIMIT 1;")
          CODE=$(curl -sS -o /tmp/self-revoke.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "http://localhost:18080/v1/control/scopes/$ASSIGN")
          test "$CODE" = "409"
          grep -q 'self_scope_revoke_forbidden' /tmp/self-revoke.json
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "INSERT INTO admin_users(name,email,password_hash,role,status) SELECT 'CI Second Admin','ci-second@sodienthoai.test',password_hash,'super-admin','active' FROM admin_users WHERE id='$ADMINID';"
          SECOND=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT id FROM admin_users WHERE email='ci-second@sodienthoai.test';")
          SECONDASSIGN=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO control_admin_assignments(admin_user_id,role_id,organization_id) VALUES('$SECOND','$SUPERROLE','$ORG') RETURNING id;")
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "http://localhost:18080/v1/control/scopes/$SECONDASSIGN" | grep -q '"ok":true'
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "DELETE FROM admin_users WHERE id='$SECOND';"
          COUNT=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT count(*) FROM control_admin_assignments ca JOIN control_roles r ON r.id=ca.role_id JOIN admin_users au ON au.id=ca.admin_user_id WHERE ca.organization_id='$ORG' AND ca.site_id IS NULL AND r.slug='super-admin' AND au.status='active';")
          test "$COUNT" = "1"
          DUP=$(curl -sS -o /tmp/duplicate-scope.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"adminUserId\":\"$ADMINID\",\"roleId\":\"$SUPERROLE\",\"organizationId\":\"$ORG\"}" http://localhost:18080/v1/control/scopes)
          test "$DUP" = "400"
          ORG2=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO organizations(slug,name,status) VALUES('ci-other-org','CI Other Org','active') RETURNING id;")
          ROLE2=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO control_roles(organization_id,slug,name,description,is_system) VALUES('$ORG2','ci-role','CI Other Role','cross-org test',false) RETURNING id;")
          SITE2=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO sites(organization_id,slug,name,domain,site_type,management_mode,status) VALUES('$ORG2','ci-other','CI Other','ci-other.example.com','service_site','managed','active') RETURNING id;")
          CROSS=$(curl -sS -o /tmp/cross-org.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"adminUserId\":\"$ADMINID\",\"roleId\":\"$ROLE2\",\"organizationId\":\"$ORG2\"}" http://localhost:18080/v1/control/scopes)
          test "$CROSS" = "403"
          grep -q 'scope_escalation' /tmp/cross-org.json
          IDOR=$(curl -sS -o /tmp/idor-role.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "http://localhost:18080/v1/control/roles/$ROLE2")
          test "$IDOR" = "404"
          SITEIDOR=$(curl -sS -o /tmp/idor-site.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"Nope","slug":"nope","domain":"nope.example.com","siteType":"service_site","managementMode":"managed","status":"active"}' "http://localhost:18080/v1/control/sites/$SITE2")
          test "$SITEIDOR" = "404"
          AUDIT_SCOPE=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT count(*) FROM control_audit_logs WHERE action='scope.revoke' AND organization_id='$ORG' AND resource_type='admin_assignment';")
          test "$AUDIT_SCOPE" -ge 1
          BAD_AUDIT=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT count(*) FROM control_audit_logs WHERE action IN ('scope.assign','scope.revoke') AND organization_id IS NULL;")
          test "$BAD_AUDIT" = "0"
          LIMITED=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO admin_users(name,email,password_hash,role,status) SELECT 'CI Limited','ci-limited@sodienthoai.test',password_hash,'admin','active' FROM admin_users WHERE id='$ADMINID' RETURNING id;")
          LIMITEDROLE=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "INSERT INTO control_roles(organization_id,slug,name,description,is_system) VALUES('$ORG','ci-role-manager','CI Role Manager','permission escalation test',false) RETURNING id;")
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "INSERT INTO control_role_permissions(role_id,permission_key) VALUES('$LIMITEDROLE','roles.manage'); INSERT INTO control_admin_assignments(admin_user_id,role_id,organization_id) VALUES('$LIMITED','$LIMITEDROLE','$ORG');"
          LIMITED_TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"ci-limited@sodienthoai.test","password":"v44-ci-password-not-production"}' http://localhost:18080/admin/auth/login | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          ESC=$(curl -sS -o /tmp/permission-escalation.json -w '%{http_code}' -H "Authorization: Bearer $LIMITED_TOKEN" -H 'Content-Type: application/json' -d '{"name":"Escalated","slug":"ci-escalated","description":"must fail","permissions":["roles.manage","system.manage"]}' http://localhost:18080/v1/control/roles)
          test "$ESC" = "403"
          grep -q 'permission_escalation' /tmp/permission-escalation.json
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "DELETE FROM admin_users WHERE id='$LIMITED'; DELETE FROM control_roles WHERE id='$LIMITEDROLE';"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" http://localhost:18080/admin/auth/logout | grep -q '"ok":true'
          CODE=$(curl -sS -o /tmp/admin-bad-login.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin-ci@sodienthoai.test","password":"wrong-password"}' http://localhost:18080/admin/auth/login)
          test "$CODE" = "401"
      - name: Verify phone lookup over HTTP
        run: |
          BODY=$(curl -fsS 'http://localhost:18080/v1/phone/%2B84705899899')
          echo "$BODY"
          echo "$BODY" | grep -q '"e164":"+84705899899"'
          echo "$BODY" | grep -q '"verification_status":"verified"'
          echo "$BODY" | grep -q '"seo_status":"indexable"'
      - name: Ensure Redis CLI
        run: command -v redis-cli >/dev/null || (sudo apt-get update && sudo apt-get install -y redis-tools)
      - name: Verify Redis cache hit path
        run: |
          redis-cli -h localhost DEL 'phone:v1:+84705899899'
          curl -fsS 'http://localhost:18080/v1/phone/%2B84705899899' >/tmp/first.json
          redis-cli -h localhost EXISTS 'phone:v1:+84705899899' | grep -Fx "1"
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "UPDATE phone_numbers SET verification_status='disputed' WHERE e164='+84705899899';"
          curl -fsS 'http://localhost:18080/v1/phone/%2B84705899899' >/tmp/cached.json
          grep -q '"verification_status":"verified"' /tmp/cached.json
          redis-cli -h localhost DEL 'phone:v1:+84705899899'
          curl -fsS 'http://localhost:18080/v1/phone/%2B84705899899' >/tmp/refreshed.json
          grep -q '"verification_status":"disputed"' /tmp/refreshed.json
      - name: Evaluate SEO quality
        run: go run ./cmd/seo-evaluate
      - name: Verify SEO quality decision
        run: |
          STATUS=$(PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -At -c "SELECT seo_status || '|' || seo_reason FROM phone_numbers WHERE e164='+84705899899';")
          echo "$STATUS" | grep -Fx "noindex|insufficient_quality"
      - name: Reindex phone data into OpenSearch
        run: go run ./cmd/reindex
      - name: Verify OpenSearch phone document
        run: |
          for i in $(seq 1 15); do
            DOC=$(curl -fsS -H 'Content-Type: application/json' 'http://localhost:9200/phone_numbers/_search' \
              -d '{"query":{"term":{"e164":"+84705899899"}}}' || true)
            echo "$DOC"
            if echo "$DOC" | grep -q '"+84705899899"' && echo "$DOC" | grep -q '"verification_status":"disputed"'; then
              exit 0
            fi
            sleep 1
          done
          echo "OpenSearch document was not searchable after reindex"
          exit 1
      - name: Verify unknown phone response
        run: |
          CODE=$(curl -sS -o /tmp/not-found.json -w '%{http_code}' 'http://localhost:18080/v1/phone/%2B84999999999')
          test "$CODE" = "200"
          grep -q '"identified":false' /tmp/not-found.json
      - name: Verify V41 business constraints and privacy
        run: |
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO user_accounts(subject_key) VALUES('ci-owner'),('ci-other') ON CONFLICT(subject_key) DO NOTHING;
          INSERT INTO businesses(slug,legal_name,display_name,verification_status,created_by)
          SELECT 'ci-business','CI Business','CI Business','verified',id FROM user_accounts WHERE subject_key='ci-owner'
          ON CONFLICT(slug) DO UPDATE SET verification_status='verified';
          INSERT INTO business_ownerships(business_id,user_id,role,status)
          SELECT b.id,u.id,'owner','verified' FROM businesses b,user_accounts u WHERE b.slug='ci-business' AND u.subject_key='ci-owner'
          ON CONFLICT(business_id,user_id) DO UPDATE SET status='verified';
          INSERT INTO business_verification_requests(business_id,user_id,method,statement,evidence_ref,status)
          SELECT b.id,u.id,'manual','private verification statement','private://must-not-leak','approved' FROM businesses b,user_accounts u WHERE b.slug='ci-business' AND u.subject_key='ci-owner';
          INSERT INTO business_reviews(business_id,user_id,rating,body,status)
          SELECT b.id,u.id,5,'approved public review','approved' FROM businesses b,user_accounts u WHERE b.slug='ci-business' AND u.subject_key='ci-other';
          SQL
          BODY=$(curl -fsS 'http://localhost:18080/v1/businesses/ci-business')
          echo "$BODY" | grep -q '"verified":true'
          echo "$BODY" | grep -q 'approved public review'
          ! echo "$BODY" | grep -q 'private://must-not-leak'
          ! echo "$BODY" | grep -q 'private verification statement'
          SITEMAP=$(curl -fsS 'http://localhost:18080/v1/seo/business-sitemap?limit=50000')
          echo "$SITEMAP" | grep -q '"slug":"ci-business"'
          PGPASSWORD=sodienthoai psql -h localhost -U sodienthoai -d sodienthoai -v ON_ERROR_STOP=1 -c "UPDATE businesses SET verification_status='rejected' WHERE slug='ci-business';"
          CODE=$(curl -sS -o /tmp/business-hidden.json -w '%{http_code}' 'http://localhost:18080/v1/businesses/ci-business')
          test "$CODE" = "404"
          SITEMAP=$(curl -fsS 'http://localhost:18080/v1/seo/business-sitemap?limit=50000')
          ! echo "$SITEMAP" | grep -q '"slug":"ci-business"'
      - name: Verify V42 business hardening
        working-directory: .
        run: bash scripts/test-v42-business.sh
      - name: API logs on failure
        if: failure()
        run: cat /tmp/sodienthoai-api.log || true
