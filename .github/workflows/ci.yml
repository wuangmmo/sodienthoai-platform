name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate web dependency lock for image build
        working-directory: apps/web
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Build API image
        run: docker build -t sodienthoai-api:ci apps/api
      - name: Build Web image
        run: docker build -t sodienthoai-web:ci apps/web
      - name: Validate Compose configuration
        run: docker compose config --quiet
